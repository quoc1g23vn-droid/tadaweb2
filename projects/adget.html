<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchDaily GetLink — Xem ảnh + bài viết, không modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0f13;--card:#171922;--card2:#1e2130;--line:#2a2e40;--text:#f2f3f6;--muted:#9aa1b2;--gold:#f2b705;--gold2:#ffd34d;--blue:#8ec5ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  a{color:var(--blue)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151724,#0e0f13)}
  .topbar{display:flex;align-items:center;gap:14px;padding:18px 0}
  .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff7a18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#111;flex:0 0 auto}
  .brand h1{margin:0;font-size:22px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .topbar .spacer{flex:1}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:10px}
  .btn-gold{background:var(--gold);color:#111;font-weight:700;padding:13px 22px;font-size:15px}
  .btn-gold:hover{background:var(--gold2)}
  .btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:11px 16px;font-size:14px}
  .btn-ghost:hover{border-color:#4a5170}
  .btn-ghost:disabled,.btn-gold:disabled{opacity:.55;cursor:wait}
  .btn-mini{padding:9px 14px;font-size:13px;border-radius:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=url]{flex:1;min-width:260px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:#0f1119;color:#fff;font-size:15px;outline:none}
  input[type=url]:focus{border-color:var(--gold)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:12.5px;color:#c8cddb;background:#232636;border:1px solid var(--line);padding:6px 11px;border-radius:999px}
  #status{margin:12px 0 0;color:#f0c96a;font-size:14px;min-height:20px}
  .browse-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .browse-label{font-size:13px;color:var(--muted);flex:0 0 auto}
  .bchip{font-size:13px;color:#c8cddb;background:#232636;border:1px solid var(--line);padding:7px 13px;border-radius:999px;cursor:pointer}
  .bchip:hover{border-color:#5a6285}
  .bchip.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
  .pcard{cursor:pointer;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1b1e2b}
  .pcard:hover{border-color:var(--gold)}
  .pcard img{width:100%;height:140px;object-fit:cover;display:block;background:#232636}
  .pcard .ph{height:140px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--gold);background:linear-gradient(135deg,#232636,#1a1c28)}
  .pcard h4{margin:0;padding:10px 12px;font-size:13.5px;line-height:1.45;font-weight:600}
  .pcard p{margin:0;padding:0 12px 10px;color:var(--muted);font-size:12px}
  .sel{background:#232636;color:#e8eaf0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13.5px;max-width:230px}
  .grid.list{grid-template-columns:1fr}
  .prow{display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px;background:#1b1e2b}
  .prow:hover{border-color:var(--gold)}
  .prow img{width:120px;height:80px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#232636}
  .prow h4{margin:0 0 4px;font-size:14px;line-height:1.4}
  .prow p{margin:0;color:var(--muted);font-size:12.5px}
  #recent{font-size:13px;color:var(--muted);margin-top:8px}
  #recent a{color:var(--blue);cursor:pointer;text-decoration:none;margin-right:14px}
  #out{display:none}
  #title{font-size:26px;line-height:1.3;margin:4px 0 6px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
  .viewer{position:relative;background:#000;border-radius:14px;overflow:hidden}
  .viewer img.main{width:100%;height:70vh;object-fit:contain;display:block;background:#000}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:88px;font-size:36px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;z-index:3}
  .nav:hover{background:rgba(0,0,0,.75)}
  #prev{left:12px}#next{right:12px}
  .count-pill{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-size:13px;z-index:3}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 2px;flex-wrap:wrap;gap:10px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  #cap{font-size:13px;color:var(--muted);flex:1;text-align:center;padding:0 8px}
  #progWrap{display:none;height:8px;background:#2a2d3f;border-radius:4px;overflow:hidden;margin:10px 2px 2px}
  #progBar{height:100%;width:0;background:var(--gold);transition:width .2s}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 2px}
  .thumbs img{width:92px;height:62px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.55;border:2px solid transparent}
  .thumbs img.on{opacity:1;border-color:var(--gold)}
  article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 28px;line-height:1.8;font-size:16px;color:#dde0e8;margin:18px 0}
  article h2{margin-top:0;font-size:20px}
  article p{margin:0 0 14px}
  .tr-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .tr-note{font-size:13px;color:var(--muted)}
  footer{color:var(--muted);font-size:13px;line-height:1.7;padding:10px 0 36px}
  @media(max-width:640px){.viewer img.main{height:52vh}#title{font-size:21px}article{padding:18px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar">
    <div class="logo">AD</div>
    <div class="brand">
      <h1>ArchDaily GetLink</h1>
    </div>
    <div class="spacer"></div>
  </div>
</div></header>

<div class="wrap">
  <div class="card">
    <div class="search-row">
      <input type="url" id="url" placeholder="Dán link bài viết ArchDaily vào đây… ví dụ: archdaily.com/786168/…">
      <button class="btn-gold" id="go">Lấy bài</button>
    </div>
    <div id="status"></div>
    <div class="browse-row">
      <span class="browse-label">Duyệt công trình:</span>
      <span id="browseChips" style="display:flex;gap:8px;flex-wrap:wrap"></span>
    </div>
    <div class="search-row" style="margin-top:10px">
      <input type="text" id="kw" placeholder="Tìm công trình, văn phòng, nhà hàng…">
      <button class="btn-ghost" id="kwGo">Tìm</button>
    </div>
    <div class="browse-row">
      <span class="browse-label">Thể loại:</span>
      <select id="catSel" class="sel"><option value="">Tất cả thể loại</option></select>
      <span class="browse-label" style="margin-left:6px">Địa điểm:</span>
      <select id="countrySel" class="sel"><option value="">Tất cả quốc gia</option></select>
      <span class="browse-label" style="margin-left:6px">Hiển thị:</span>
      <button class="bchip viewbtn on" id="viewGrid">⊞ Lưới</button>
      <button class="bchip viewbtn" id="viewList">☰ Danh sách</button>
    </div>
    <div class="grid" id="grid"></div>
    <div style="text-align:center;margin-top:12px"><button class="btn-ghost" id="moreBtn" style="display:none">Xem thêm công trình</button></div>
  </div>

  <main id="out">
    <div id="title"></div>
    <div class="meta"><span id="metaInfo"></span> · <a id="origLink" href="#" target="_blank" rel="noopener">Mở bài gốc trên ArchDaily ↗</a></div>
    <div class="viewer">
      <img class="main" id="mainImg" alt="">
      <span class="count-pill" id="count"></span>
      <button class="nav" id="prev" title="Ảnh trước (phím ←)">&#8249;</button>
      <button class="nav" id="next" title="Ảnh sau (phím →)">&#8250;</button>
    </div>
    <div class="bar">
      <span id="cap"></span>
      <span class="tools">
        <button class="btn-gold btn-mini" id="dlFolder">⬇ Tải tất cả vào thư mục…</button>
        <button class="btn-ghost btn-mini" id="dlOne">⬇ Tải ảnh này</button>
        <button class="btn-ghost btn-mini" id="dlAll">⬇ Tải tất cả (.zip)</button>
        <button class="btn-ghost btn-mini" id="dlRetry" style="display:none">⬇ Tải lại ảnh còn thiếu</button>
        <button class="btn-ghost btn-mini" id="copyLinks">Copy link tất cả ảnh lớn</button>
      </span>
    </div>
    <div id="progWrap"><div id="progBar"></div></div>
    <div class="thumbs" id="thumbs"></div>

    <section id="related" style="display:none;margin-top:26px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn-ghost btn-mini" id="backBtn" style="display:none">← Quay lại</button>
        <h2 style="margin:0;font-size:18px">Công trình liên quan</h2>
      </div>
      <div id="relMeta" style="color:var(--muted);font-size:13.5px;margin:8px 0 4px"></div>
      <div class="browse-row" id="relTabs" style="margin-top:8px"></div>
      <div class="grid" id="relGrid"></div>
      <div style="text-align:center;margin-top:12px"><button class="btn-ghost" id="relMoreBtn" style="display:none">Xem thêm công trình liên quan</button></div>
    </section>

    <article id="article" style="display:none">
      <h2>Nội dung bài viết</h2>
      <div class="tr-bar">
        <button class="btn-gold btn-mini" id="translateBtn">🌐 Dịch sang tiếng Việt</button>
        <span class="tr-note" id="trNote">Bấm để dịch toàn bộ nội dung bài viết sang tiếng Việt (bấm lại để về bản gốc).</span>
      </div>
      <div id="paras"></div>
    </article>
  </main>

</div>

<script>
const $=id=>document.getElementById(id);
let IMGS=[], i=0, CURRENT_FLOW=[], TRANSLATED_FLOW=null, SHOWING_VI=false;

function setStatus(t){$('status').textContent=t||''}
function projectUrl(u){
  u=(u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  try{
    const url=new URL(u);
    const parts=url.pathname.split('/').filter(Boolean);
    if(parts.length>=2 && /-photo$/.test(parts[parts.length-1])) parts.pop();
    url.pathname='/'+parts.join('/'); url.search=''; url.hash='';
    return url.toString();
  }catch(e){ return u }
}
function large(u){ return u.replace(/\/(thumb_jpg|medium_jpg|small_jpg|newsletter|slide_jpg)\//,'/large_jpg/'); }

async function fetchPage(u){
  try{
    setStatus('Đang lấy dữ liệu bài viết…');
    const r=await fetch('https://r.jina.ai/'+u);
    if(r.ok){ const t=await r.text(); if(t && t.includes('adsttc')) return {type:'md', text:t}; }
  }catch(e){}
  const PROXIES=[
    x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),
    x=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(x)
  ];
  for(const mk of PROXIES){
    try{
      const r=await fetch(mk(u));
      if(!r.ok) continue;
      const t=await r.text();
      if(t && t.includes('adsttc')) return {type:'html', text:t};
    }catch(e){}
  }
  return null;
}
function extractMd(md){
  const tm=md.match(/^Title:\s*(.+)$/m);
  const title=tm?tm[1].trim():'';
  const seen=new Set(), imgs=[];
  function add(raw,alt){
    if(!raw) return;
    let u=raw.trim();
    if(!u.includes('images.adsttc.com/media/images/')) return;
    const m=u.match(/^(https:\/\/images\.adsttc\.com\/media\/images\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4})\//i);
    const key=m?m[1]:u.split('?')[0];
    if(seen.has(key)) return;
    seen.add(key);
    imgs.push({src:large(u), thumb:u.replace(/\/(large_jpg|medium_jpg|small_jpg|newsletter|slide_jpg)\//,'/thumb_jpg/'), alt:(alt||'').replace(/^Image \d+:\s*/,'').trim()});
  }
  let mm; const re=/!\[([^\]]*)\]\((https:\/\/images\.adsttc\.com\/media\/images\/[^)\s]+)\)/g;
  while((mm=re.exec(md))!==null) add(mm[2], mm[1]);
  if(imgs.length<3) (md.match(/https:\/\/images\.adsttc\.com\/media\/images\/[^)\s"']+/g)||[]).forEach(u=>add(u,''));
  const bad=/cookie|subscribe|newsletter|sign up|all rights reserved|follow us|download the app|url source|published time|markdown content|cite:|location to be used only as a reference|receive updates based on what you follow/i;
  const ps=[], pseen=new Set();
  md.split(/\n\s*\n/).forEach(b=>{
    let t=b.replace(/\[\!\[[^\]]*\]\([^)]*\)\]\([^)]*\)/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#>*_`-]/g,'').replace(/\s+/g,' ').trim();
    if(t.length<70||t.length>2500) return;
    if(bad.test(t)||pseen.has(t)) return;
    pseen.add(t); ps.push(t);
  });
  const flow=[], seenF=new Set();
  function flowKey(u){ const mm=u.match(/^(https:\/\/images\.adsttc\.com\/media\/images\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4})\//i); return mm?mm[1]:u.split('?')[0]; }
  md.split(/\n\s*\n/).forEach(b=>{
    const imgsIn=[...b.matchAll(/!\[([^\]]*)\]\((https:\/\/images\.adsttc\.com\/media\/images\/[^)\s]+)\)/g)];
    let t=b.replace(/\[\!\[[^\]]*\]\([^)]*\)\]\([^)]*\)/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#>*_`\-]/g,'').replace(/\s+/g,' ').trim();
    if(imgsIn.length){
      let last=null;
      imgsIn.forEach(mm=>{
        const key=flowKey(mm[2]);
        if(seenF.has(key)) return;
        seenF.add(key);
        last={t:'img', src:large(mm[2]), alt:(mm[1]||'').replace(/^Image \d+:\s*/,'').trim(), cap:''};
        flow.push(last);
      });
      if(last && t && t.length<=90 && !bad.test(t)) last.cap=t;
      else if(t && t.length>=40 && !bad.test(t)) flow.push({t:'text', text:t});
    } else if(t && t.length>=40 && !bad.test(t)) flow.push({t:'text', text:t});
  });
  return {title, imgs, ps, flow};

}
function extract(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const title=(doc.querySelector('meta[property="og:title"]')||{}).content || (doc.querySelector('h1')||{}).textContent || document.title;
  const seen=new Set(), imgs=[];
  function add(raw,alt){
    if(!raw) return;
    let u=raw.split(' ')[0].trim();
    if(!u.includes('images.adsttc.com/media/images/')) return;
    if(u.startsWith('//')) u='https:'+u;
    const m=u.match(/^(https:\/\/images\.adsttc\.com\/media\/images\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4}\/[0-9a-f]{4})\//i);
    const key=m?m[1]:u.split('?')[0];
    if(seen.has(key)) return;
    seen.add(key);
    imgs.push({src:large(u), thumb:u.replace(/\/(large_jpg|medium_jpg|small_jpg|newsletter|slide_jpg)\//,'/thumb_jpg/'), alt:(alt||'').trim()});
  }
  doc.querySelectorAll('img').forEach(im=>{
    add(im.getAttribute('src')||im.getAttribute('data-src'), im.getAttribute('alt'));
    const ss=im.getAttribute('srcset')||im.getAttribute('data-srcset');
    if(ss) ss.split(',').forEach(p=>add(p.trim(), im.getAttribute('alt')));
  });
  if(imgs.length<3){
    (html.match(/https:\/\/images\.adsttc\.com\/media\/images\/[^"'\s\\]+/g)||[]).forEach(u=>add(u,''));
  }
  const bad=/cookie|subscribe|newsletter|sign up|all rights reserved|follow us|download the app/i;
  const ps=[], pseen=new Set();
  doc.querySelectorAll('p').forEach(p=>{
    const t=(p.textContent||'').replace(/\s+/g,' ').trim();
    if(t.length<70||t.length>2500) return;
    if(bad.test(t)) return;
    if(pseen.has(t)) return;
    pseen.add(t); ps.push(t);
  });
  if(ps.length<2){
    const md=(doc.querySelector('meta[name="description"]')||{}).content;
    if(md && md.trim().length>70 && !pseen.has(md.trim())) ps.unshift(md.trim());
  }
  return {title:title.replace(/\s*\|\s*ArchDaily.*$/i,'').trim(), imgs, ps, flow:[...ps.map(t=>({t:'text',text:t})), ...imgs.map(it=>({t:'img',src:it.src,alt:it.alt,cap:''}))]};
}
function show(n){
  if(!IMGS.length) return;
  i=((n-1)%IMGS.length+IMGS.length)%IMGS.length+1;
  const it=IMGS[i-1];
  const im=$('mainImg');
  im.onerror=()=>{ IMGS.splice(i-1,1); if(IMGS.length) show(Math.min(i,IMGS.length)); };
  im.src=it.src;
  $('count').textContent=i+' / '+IMGS.length;
  $('cap').textContent=it.alt||'';
  document.querySelectorAll('.thumbs img').forEach((t,k)=>t.classList.toggle('on',k===i-1));
  const th=document.querySelectorAll('.thumbs img')[i-1];
  if(th) th.scrollIntoView({block:'nearest',inline:'center'});
  const nxt=IMGS[i%IMGS.length]; if(nxt){const p=new Image(); p.src=nxt.src;}
}
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderFlow(list){
  $('paras').innerHTML=list.map(it=>{
    if(it.t==='img'){ let cp=it.cap||it.alt||''; if(cp.indexOf(' - ')>=0) cp=cp.split(' - ').slice(1).join(' - '); else if(cp===$('title').textContent) cp=''; return '<figure style="margin:20px 0"><img src="'+it.src+'" style="width:100%;border-radius:10px;display:block" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"><figcaption style="color:#9aa1b2;font-size:13px;margin-top:6px">'+esc(cp)+'</figcaption></figure>'; }
    return '<p>'+esc(it.text)+'</p>';
  }).join('');
}
function render(data,url){
  IMGS=data.imgs; i=1;
  CURRENT_FLOW=data.flow||data.ps.map(t=>({t:'text',text:t})); TRANSLATED_FLOW=null; SHOWING_VI=false;
  const nTxt=CURRENT_FLOW.filter(x=>x.t==='text').length;
  $('title').textContent=data.title||'';
  $('metaInfo').textContent=IMGS.length+' ảnh lớn'+(nTxt?(' · Bài viết gồm '+nTxt+' đoạn'):'');
  $('origLink').href=url;
  const th=$('thumbs'); th.innerHTML='';
  IMGS.forEach((it,k)=>{const t=document.createElement('img'); t.src=it.thumb; t.loading='lazy'; t.onclick=()=>show(k+1); th.appendChild(t);});
  if(CURRENT_FLOW.length){
    $('article').style.display='block';
    renderFlow(CURRENT_FLOW);
    $('translateBtn').textContent='🌐 Dịch sang tiếng Việt';
    $('trNote').textContent='Bấm để dịch toàn bộ nội dung bài viết sang tiếng Việt (bấm lại để về bản gốc).';
  } else $('article').style.display='none';
  $('out').style.display='block';
  show(1);
  setStatus('Đã lấy được '+IMGS.length+' ảnh lớn'+(nTxt?' và bài viết kèm ảnh':'')+'. Bấm Next/Back hoặc dùng phím ← → để xem.');
  saveRecent(url,data.title);
}
function saveRecent(url,title){
  try{
    let r=JSON.parse(localStorage.getItem('ad_recent')||'[]');
    r=r.filter(x=>x.u!==url); r.unshift({u:url,t:title||url}); r=r.slice(0,5);
    localStorage.setItem('ad_recent',JSON.stringify(r)); drawRecent();
  }catch(e){}
}
function drawRecent(){
  try{
    const r=JSON.parse(localStorage.getItem('ad_recent')||'[]');
    $('recent').innerHTML=r.length?('Đã xem gần đây: '+r.map((x,k)=>'<a data-k="'+k+'">'+(x.t||x.u).slice(0,42)+'…</a>').join('')):'';
    $('recent').querySelectorAll('a').forEach(a=>a.onclick=()=>{ $('url').value=r[+a.dataset.k].u; run(); });
  }catch(e){}
}

function parseProjects(md){
  const re=/\[!\[([^\]]*)\]\(([^)]+)\)\s*##\s*([^\]]+)\]\((https:\/\/www\.archdaily\.com\/\d{6,}\/[^)\s?#]+)|!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)|\[([^\]]+)\]\((https:\/\/www\.archdaily\.com\/\d{6,}\/[^)\s?#]+)/g;
  const out=[], seen=new Set(); let last='', m;
  while((m=re.exec(md))!==null){
    if(m[4]){
      const title=m[3].trim(), url=cleanProjUrl(m[4]);
      let thumb=m[2]||'';
      if(thumb.includes('logo')) thumb='';
      if(!title || seen.has(url)) continue;
      seen.add(url); out.push({title, url, thumb}); last='';
    } else if(m[6]){
      const u=m[6];
      if(!u.includes('logo') && (u.includes('adsttc.com/media/images') || u.includes('snoopy.archdaily.com'))) last=u;
    } else if(m[8]){
      const title=(m[7]||'').split('###').pop().trim(), url=cleanProjUrl(m[8]);
      if(!title || seen.has(url)) continue;
      seen.add(url); out.push({title, url, thumb:last}); last='';
    }
  }
  return out;
}
function parseProjectsHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out=[], seen=new Set();
  doc.querySelectorAll('a[href]').forEach(a=>{
    const href=(a.getAttribute('href')||'').split('?')[0].split('#')[0].replace(/\/$/,'');
    const m=href.match(/^https?:\/\/(www\.)?archdaily\.com\/(\d{6,})\/([^\/]+)/i);
    if(!m) return;
    const url='https://www.archdaily.com/'+m[2]+'/'+m[3];
    if(seen.has(url)) return;
    let title=(a.textContent||'').replace(/\s+/g,' ').trim();
    for(let h=Math.floor(title.length/2); h>=Math.floor(title.length/2)-1 && h>4; h--){
      if(title.slice(0,h)===title.slice(title.length-h)){ title=title.slice(0,h).trim(); break; }
    }
    if(title.length<6) return;
    seen.add(url);
    const im=a.querySelector('img');
    let thumb=im?((im.getAttribute('src')||im.getAttribute('data-src')||im.getAttribute('data-lazy')||'').split(' ')[0]):'';
    if(thumb.startsWith('//')) thumb='https:'+thumb;
    if(/logo|avatar|icon/i.test(thumb)) thumb='';
    out.push({title, url, thumb});
  });
  return out;
}

  if(!b){ window.open(IMGS[i-1].src,'_blank'); setStatus('Không tải trực tiếp được nên đã mở ảnh lớn ở tab mới — chuột phải vào ảnh, chọn Lưu hình ảnh.'); return; }
  saveBlob(b, fname(IMGS[i-1].src, i));
  setStatus('Đã tải xong ảnh '+i+' ('+Math.round(b.size/1024)+' KB). Xem trong thư mục Downloads.');
}
async function downloadAll(){
  if(!IMGS.length) return;
  const btn=$('dlAll'); btn.disabled=true;
  setProg(0, IMGS.length);
  const blobs=await fetchAllParallel((d,t)=>{ setProg(d,t); setStatus('Đang tải ảnh '+d+' / '+t+' để đóng gói ZIP…'); });
  const files=[];
  for(let k=0;k<blobs.length;k++){ if(blobs[k]) files.push({name:fname(IMGS[k].src,k+1), data:new Uint8Array(await blobs[k].arrayBuffer())}); }
  const missZ=missingFrom(blobs); noteMissing(missZ);
  if(!files.length){ setStatus('Không tải được ảnh nào — mạng có thể đang chập chờn, thử lại sau ít phút.'); btn.disabled=false; setProg(-1); return; }
  saveBlob(makeZip(files), articleSlug()+'-'+files.length+'-anh.zip');
  setStatus('Đã tải xong file ZIP gồm '+files.length+' ảnh lớn, đã đánh số 01, 02, 03 theo thứ tự xem.'+(missZ.length?' Còn '+missZ.length+' ảnh chưa lấy được (số '+missZ.map(k=>k+1).join(', ')+') — bấm nút tải lại ảnh còn thiếu để tải lẻ các tấm đó.':''));
  btn.disabled=false; setProg(-1);
}
async function writeToDir(dir, idxs, label){
  const res={}; let done=0;
  const q=idxs.slice();
  async function w(){
    while(q.length){
      const k=q.shift();
      const b=await getImgBlob(IMGS[k].src);
      if(b){
        try{ const fh=await dir.getFileHandle(fname(IMGS[k].src,k+1),{create:true}); const wr=await fh.createWritable(); await wr.write(b); await wr.close(); res[k]=true; }
        catch(e){ res[k]=false; }
      } else res[k]=false;
      done++; setProg(done, IMGS.length);
      setStatus('Đang lưu ảnh vào thư mục '+label+' — '+done+' / '+idxs.length+'…');
      await new Promise(r=>setTimeout(r,300));
    }
  }
  await Promise.all([w(),w()]);
  return idxs.filter(k=>!res[k]);
}
async function downloadToFolder(){
  if(!IMGS.length) return;
  if(!window.showDirectoryPicker){
    setStatus('Trình duyệt này không cho chọn thư mục — mình tải từng ảnh vào thư mục Downloads thay thế. Nếu Chrome hỏi Cho phép tải nhiều file, bấm Cho phép.');
    return downloadEach();
  }
  let root;
  try{ root=await window.showDirectoryPicker(); }
  catch(e){ setStatus('Đã hủy chọn thư mục nên chưa tải gì. Bấm nút tải lại khi sẵn sàng.'); return; }
  const slug=articleSlug();
  let dir=root;
  try{ dir=await root.getDirectoryHandle(slug,{create:true}); }catch(e){}
  LASTDIR=dir;
  const btn=$('dlFolder'); btn.disabled=true;
  setProg(0, IMGS.length);
  const miss=await writeToDir(dir, IMGS.map((_,k)=>k), slug);
  noteMissing(miss);
  if(miss.length) setStatus('Đã lưu '+(IMGS.length-miss.length)+' / '+IMGS.length+' ảnh vào thư mục '+slug+'. Còn thiếu '+miss.length+' ảnh (số '+miss.map(k=>k+1).join(', ')+') — bấm nút tải lại ảnh còn thiếu ngay bên dưới, không cần chọn lại thư mục.');
  else setStatus('Xong! Đã lưu đủ '+IMGS.length+' ảnh vào thư mục con '+slug+' trong thư mục Hiệp vừa chọn.');
  btn.disabled=false; setProg(-1);
}
async function downloadEach(){
  const btn=$('dlFolder'); btn.disabled=true;
  setProg(0, IMGS.length);
  const blobs=await fetchAllParallel((d,t)=>{ setProg(d,t); setStatus('Đang tải ảnh '+d+' / '+t+'…'); });
  let ok=0;
  blobs.forEach((b,k)=>{ if(b){ saveBlob(b, fname(IMGS[k].src,k+1)); ok++; } });
  const miss=missingFrom(blobs); noteMissing(miss); LASTDIR=null;
  setStatus('Đã tải '+ok+' / '+IMGS.length+' ảnh vào thư mục Downloads của Chrome.'+(miss.length?' Còn thiếu số '+miss.map(k=>k+1).join(', ')+' — bấm nút tải lại ảnh còn thiếu.':''));
  btn.disabled=false; setProg(-1);
}
async function retryMissing(){
  if(!MISSING.length) return;
  const btn=$('dlRetry'); btn.disabled=true;
  const idxs=MISSING.slice();
  if(LASTDIR){
    const miss=await writeToDir(LASTDIR, idxs, articleSlug());
    noteMissing(miss);
    setStatus(miss.length?('Vẫn chưa lấy được '+miss.length+' ảnh (số '+miss.map(k=>k+1).join(', ')+'). Nếu là tấm sơ đồ cuối của bài Stanford thì tấm đó hỏng ngay trên server ArchDaily (lỗi 403), không cách nào tải được — Hiệp bỏ qua tấm đó nhé.'):'Đã tải đủ các ảnh còn thiếu vào thư mục rồi.');
  } else {
    const still=[];
    const q=idxs.slice();
    async function w(){ while(q.length){ const k=q.shift(); const b=await getImgBlob(IMGS[k].src); if(b) saveBlob(b, fname(IMGS[k].src,k+1)); else still.push(k); } }
    await Promise.all([w(),w()]);
    noteMissing(still);
    setStatus(still.length?('Vẫn thiếu '+still.length+' ảnh (số '+still.map(k=>k+1).join(', ')+').'):'Đã tải đủ các ảnh còn thiếu vào Downloads.');
  }
  btn.disabled=false; setProg(-1);
}
$('go').onclick=run;
renderBrowseChips();
ensureCountries();

$('viewGrid').onclick=()=>{ VIEW_MODE='grid'; $('viewGrid').classList.add('on'); $('viewList').classList.remove('on'); renderCards(BROWSE_LIST, $('grid')); renderCards(REL_LIST, $('relGrid')); };

$('relMoreBtn').onclick=()=>{ REL_PAGE++; loadRelated(REL_KIND, true); };

$('url').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
$('prev').onclick=()=>show(i-1);
$('next').onclick=()=>show(i+1);
$('mainImg').onclick=e=>{ const r=e.target.getBoundingClientRect(); show(e.clientX-r.left>r.width/2?i+1:i-1); };

$('copyLinks').onclick=e=>{e.preventDefault(); navigator.clipboard&&navigator.clipboard.writeText(IMGS.map(x=>x.src).join('\n')); setStatus('Đã copy link của '+IMGS.length+' ảnh lớn.');};
document.addEventListener('keydown',e=>{
  if($('out').style.display!=='block') return;
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') show(i+1);
  if(e.key==='ArrowLeft') show(i-1);
  if(e.key==='f'||e.key==='F') document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
});
drawRecent();
